# Publish the site: the landing page and interactives from site/, plus the
# whole curriculum from docs/ rendered into browsable lessons.
#
# GitHub's built-in "deploy from a branch" option can only publish the repo
# root or docs/, and we need both plus a render step, so we build and upload
# the result ourselves.
#
# tools/build_site.py uses the standard library and nothing else, matching the
# promise the Python side makes and the one the interactives make about not
# fetching anything at load time. If this workflow ever grows an `npm
# install`, something has gone wrong.

name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "tools/build_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the site
        # Renders docs/ into browsable lessons alongside the static pages.
        # Standard library only, like everything else here.
        run: python tools/build_site.py --out _site

      - name: Check the interactives are self-contained
        # A learner may be working offline, on a train, or behind a filter
        # that blocks CDNs. If a page pulls a script or font from someone
        # else's server, it can break for them and we would never see it.
        #
        # Ordinary <a href> links out to GitHub are fine -- those are the
        # reader choosing to leave. What must not appear is anything the page
        # *fetches on load*: scripts, stylesheets, fonts, images, iframes.
        run: |
          if grep -rInE 'src="https?://|<link[^>]+href="https?://|url\(https?://|@import[^;]*https?://' _site/ ; then
            echo "::error::the site must not fetch anything from an external host."
            exit 1
          fi
          echo "Nothing loaded from outside the repo. OK"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
